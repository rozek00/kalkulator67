<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator 67</title>
    <script>
        function calculate() {
            var output = document.getElementById("output");
            if (output.innerHTML.trim() === "") {
                output.innerHTML = "0";
                return;
            }
            if(!output.innerHTML.includes("*") && !output.innerHTML.includes("/") && !output.innerHTML.includes("+") && !output.innerHTML.includes("-")) {
                return;
            }
            if(output.innerHTML.endsWith("*") || output.innerHTML.endsWith("/") || output.innerHTML.endsWith("+") || output.innerHTML.endsWith("-")) {
                return;
            }
            output.innerHTML = "67";
        }
        function writeToOutput(value) {
            var output = document.getElementById("output");
            output.innerHTML += value;
        }
    </script>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #2b2b2b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    div {
        background: #1f1f1f;
        padding: 20px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #output {
        height: 70px;
        background: #111;
        color: white;
        font-size: 32px;
        text-align: right;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
        overflow-x: auto;
    }

    button {
        width: 65px;
        height: 65px;
        margin: 5px;
        font-size: 22px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #3d3d3d;
        color: white;
        transition: 0.2s;
    }

    button:hover {
        background: #555;
    }

    button:active {
        transform: scale(0.95);
    }

    button:last-child {
        background: orange;
        color: black;
        font-weight: bold;
    }

    button:last-child:hover {
        background: darkorange;
    }
    .calculator {
    background: #1f1f1f;
    padding: 20px;
    border-radius: 15px;
    width: 360px;
    box-shadow: 0 0 20px rgba(0,0,0,.5);

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

#output {
    grid-column: 1 / 5;
}

button {
    width: 100%;
    height: 65px;
}
</style>
</head>
<body>

<div class="calculator">
    <div id="output">
        
    </div>
    <button onclick="writeToOutput('1')">1</button>
    <button onclick="writeToOutput('2')">2</button>
    <button onclick="writeToOutput('3')">3</button>
    <button onclick="writeToOutput('4')">4</button>
    <button onclick="writeToOutput('5')">5</button>
    <button onclick="writeToOutput('6')">6</button> 
    <button onclick="writeToOutput('7')">7</button>
    <button onclick="writeToOutput('8')">8</button>
    <button onclick="writeToOutput('9')">9</button>
    <button onclick="writeToOutput('0')">0</button>
    <button onclick="writeToOutput('.')">.</button>
    <button onclick="writeToOutput('+')">+</button>
    <button onclick="writeToOutput('-')">-</button>
    <button onclick="writeToOutput('*')">*</button>
    <button onclick="writeToOutput('/')">/</button>
    <button onclick="calculate()">=</button>
</div>

</body>
</html>
